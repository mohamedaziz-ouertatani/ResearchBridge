services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: researchbridge
      POSTGRES_PASSWORD: researchbridge
      POSTGRES_DB: researchbridge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
