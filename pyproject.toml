[project]
name = "researchbridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohamedaziz-ouertatani", email = "mohamedaziz.ouertatani@esprit.tn" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "feedparser>=6.0.14",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
    "tenacity>=9.1.4",
]

[project.scripts]
rb-ingest = "researchbridge.ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.2",
]
