[project]
name = "researchbridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mohamedaziz-ouertatani", email = "mohamedaziz.ouertatani@esprit.tn" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.1",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
rb-ingest = "researchbridge.ingestion.cli:main"
rb-ingest-springer = "researchbridge.ingestion.cli_springer:main"
rb-ingest-semantic-scholar = "researchbridge.ingestion.cli_semantic_scholar:main"
rb-ingest-core = "researchbridge.ingestion.cli_core:main"
rb-extract = "researchbridge.extraction.cli:main"
rb-extract-evaluate = "researchbridge.extraction.cli_evaluate:main"
rb-gaps-detect = "researchbridge.gaps.cli_detect:main"
rb-embed = "researchbridge.embedding.cli_embed:main"
rb-search = "researchbridge.embedding.cli_search:main"
rb-benchmark-sample = "researchbridge.benchmark.cli_sample:main"
rb-benchmark-fetch = "researchbridge.benchmark.cli_fetch:main"
rb-retrieval-compare = "researchbridge.retrieval.cli_compare:main"
rb-retrieval-evaluate = "researchbridge.retrieval.cli_evaluate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "responses>=0.26.2",
]
