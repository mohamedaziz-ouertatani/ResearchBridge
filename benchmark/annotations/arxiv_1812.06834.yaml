# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '1812.06834'
title: A Tutorial on Deep Latent Variable Models of Natural Language
domain: NLP
year: 2018
url: https://arxiv.org/abs/1812.06834v3
problem: 'Combining latent variable models with deep learning is powerful but difficult: deep parameterizations
  of conditional likelihoods usually make posterior inference intractable, and latent variable objectives
  often complicate backpropagation by introducing points of non-differentiability.'
research_question: How can deep latent variable models of natural language be understood, constructed,
  and learned, and how does variational inference (including amortized/neural inference) make posterior
  inference and learning tractable in this setting?
method: This is a tutorial/survey rather than an empirical paper. It introduces archetypal latent variable
  models of sentences (discrete, continuous, and structured, e.g. latent-variable Naive Bayes, continuous
  latent-vector sentence models, and Hidden Markov Models) alongside their 'deep' variants parameterized
  with MLPs and RNNs. It then surveys learning and inference techniques for these models, including direct
  maximization of the log marginal likelihood, the Expectation Maximization algorithm, and (in later sections)
  amortized variational inference and variational autoencoders.
dataset: ''
main_contribution: The paper provides a unified, pedagogical treatment connecting classical latent variable
  models (Naive Bayes, topic models, HMMs, DMV) to their deep neural parameterizations, and surveys applications
  and inference/learning techniques (variational inference, amortized inference, VAEs) for NLP, organized
  as a tutorial accompanying an EMNLP 2018 tutorial.
results: As a tutorial/survey, it does not report new experimental results; instead it walks through derivations
  (e.g. EM update equations for a Naive Bayes model) and discusses parameter-efficiency comparisons, e.g.
  that a deep categorical sentence model requires O(Kd^2+Vd) parameters versus O(KV) (or O(KVT) with position-specific
  distributions) for the shallow Naive Bayes model.
limitations: The tutorial explicitly restricts its scope to latent variable models expressible as directed
  graphical models, learned mostly through variational inference; it states it does not cover (or only
  briefly touches on) undirected graphical models such as restricted Boltzmann Machines and Markov random
  fields, posterior inference based on Markov chain Monte Carlo sampling, spectral learning of latent variable
  models, and non-likelihood-based approaches such as generative adversarial networks. It also notes that
  training implicit (adversarially trained) generative models of text remains a largely open problem, and
  that evaluation of such implicit models is difficult since, unlike explicit generative models, their log
  likelihood cannot be tractably estimated.
applications: Discussed application areas for latent variable models include document clustering (unsupervised
  document classification), mixture-of-experts models for ensembling (e.g. neural machine translation
  and diverse image captioning), topic modeling, sentence generation, unsupervised part-of-speech tagging
  and dependency parsing (e.g. DMV-based models), and text summarization/generation conditioned on latent
  templates or plans.
research_gap:
  addressed: The tutorial addresses the gap that deep parameterizations of latent variable models usually
    make posterior inference intractable and complicate backpropagation, by organizing and explaining
    the variational inference machinery (including amortized/neural inference) that makes learning such
    models feasible.
  remaining: The tutorial states that undirected graphical models, posterior inference through Markov chain
    Monte Carlo, spectral learning of latent variable models, and non-likelihood-based approaches were not
    covered, and that the intersection of latent variable models and deep learning remains an exciting avenue
    for much future work.
