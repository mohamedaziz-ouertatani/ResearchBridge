# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '2012.15419'
title: An Experimental Evaluation of Transformer-based Language Models in the Biomedical Domain
domain: NLP
year: 2020
url: https://arxiv.org/abs/2012.15419v1
problem: Large pre-trained transformer language models like BERT are being adapted to biomedical NLP tasks
  via domain-specific further pre-training (e.g., BioBERT), but this domain-specific pre-training is very
  costly and hard to replicate, and it is unclear whether the performance gains justify that cost.
research_question: Does domain-specific pre-training (further pre-training BERT on biomedical corpora)
  improve performance over domain-agnostic baseline models on downstream biomedical NLP tasks, and is it
  possible to obtain comparable results from a domain-specific BERT model pre-trained on smaller-sized
  data than the original BioBERT study used?
method: 'The authors replicate and extend the BioBERT approach: starting from BERTbase(uncased), they
  further pre-train it only on PubMed abstracts (not PMC) to create BERTbase+PM, using a PyTorch/HuggingFace
  implementation, masked-token and next-sentence-prediction objectives with max sequence length 512, and
  a fault-tolerant training pipeline (periodic checkpointing of weights/gradients, automated job resubmission
  via the system task scheduler, and restoring from data chunk/step) to handle a time-shared, preemptible
  Slurm GPU cluster. They then fine-tune both BERTbase and BERTbase+PM (and BERTlarge for QA) on downstream
  NER, relation extraction, question answering, and text summarization (via BERTSum variants) tasks, comparing
  against the original BioBERT results.'
dataset: PubMed abstracts (for pre-training, ~200 million sentences/30GB, batched into 111 chunks); NCBI
  Disease, JNLPBA, and Species-800 (NER); GAD - Genetic Association Database (relation extraction); BioASQ
  (4b/5b/6b for QA fine-tuning, 7b for summarization) and PubMedQA (PQA-L, 1k expert-annotated instances,
  10-fold cross-validation with 450 training instances per fold), with SQuAD 1.1/2.0 used for intermediate
  fine-tuning; CNN/DailyMail and XSum used as summarization comparison benchmarks.
main_contribution: The paper provides an independent replication of BioBERT-style domain-specific pre-training
  using only PubMed abstracts (a smaller data footprint than the original combined PubMed+PMC approach)
  under realistic, constrained shared-computing conditions, and systematically compares domain-specific
  vs. domain-agnostic pre-trained models across NER, RE, QA, and summarization tasks, including a zero-shot
  BioASQ evaluation.
results: 'Results were mixed: for NER, BERTbase (not further pre-trained) scored higher on average than
  BERTbase+PM (e.g., NCBI Disease F1 84.08 vs 80.33), running counter to the expectation that biomedical
  pre-training helps. For RE on GAD, BERTbase+PM outperformed BERTbase (81.50 vs 79.60 F1) but the difference
  was not significant. For QA, BioASQ results showed some evidence that domain-specific pre-training helps,
  though not convincingly so, and carefully fine-tuned BERTlarge performed comparably to BioBERT; on PubMedQA,
  BioBERT''s PubMed model achieved the highest accuracy (57.28) and F1 (28.70), but the improvement over
  BERTlarge/BERTbase/BERTbase+PM was minimal. Zero-shot BioASQ evaluation (Strict Accuracy 31.37, Lenient
  Accuracy 46.8, MRR 37.16) was markedly worse than fine-tuned results. For summarization, BERTSum trained
  on the smaller BioASQ 7b dataset performed comparably to or better than models trained on the much larger
  CNN/DailyMail and XSum datasets on several ROUGE metrics, e.g. ROUGE-2 of 29.29 for ExtAbs on BioASQ 7b
  versus 19.6 on CNN/DailyMail.'
limitations: The standard deviation in F1 scores across different runs made definitive comparisons with
  BioBERT's reported results difficult; given the small size of the biomedical QA (BioASQ) datasets, the
  pre-trained models easily overfit, making it impossible to run certain experiments; the effectiveness
  of domain-specific pre-training in the biomedical domain could not be wholly substantiated due to a lack
  of consistent evidence across NER, QA, and summarization tasks.
applications: Small-sized domain-specific pre-trained data can be especially useful in practice when models
  need to be retrained rather than reused off-the-shelf, e.g. due to data-shift over time, a wide variety
  of target domains/sub-domains, data that is confidential to an organization, or a lack of computing resources
  to train large models from scratch.
research_gap:
  addressed: Prior work (e.g., BioBERT, PubMedBERT) demonstrated domain-specific pre-training can help
    but at very high computational cost that limits reproducibility; this paper investigates whether smaller-scale,
    PubMed-only pre-training can achieve comparable results, addressing a gap in understanding cost-effectiveness
    and reproducibility of domain-specific pre-training under constrained computing resources.
  remaining: The paper states it should be beneficial for the biomedical community to curate and expand
    the magnitude of benchmark datasets (particularly for QA), since current small QA datasets cause overfitting;
    the authors also say they would like to expand their experiments to other BERT variants, more domain-specific
    datasets, a wider variety of downstream tasks, and other medical corpora for external validation and
    generalization of the results.
key_evidence:
- text: Emphasizing the cost of these models, which renders technical replication challenging, this paper
    summarizes experiments conducted in replicating BioBERT and further pre-training and careful fine-tuning
    in the biomedical domain.
  section: Abstract
- text: This runs counter to the notion that pre-training on biomedical domains corpora improves downstream
    NER.
  section: Fine-tuning language representations in the biomedical domain
- text: However, given the small size of the biomedical QA (BioASQ) datasets, it is not possible to run
    the same experiments, as the current pre-trained models easily overfit. Therefore, it should be beneficial
    for the biomedical community to curate and expand the magnitude of benchmark datasets.
  section: Discussion and Conclusion
- text: Our finding confirms that pre-trained models can be impactful in some downstream NLP tasks (QA
    and NER) in the biomedical domain; however, this improvement may not justify the high cost of domain-specific
    pre-training.
  section: Abstract
- text: Using small-sized dataset can be especially useful when the models need to retrained instead of
    using pre-trained publicly available models due to (a) data-shift, (b) wide variety of data-domains,
    (c) confidential data not publicly available to train the model on, (d) small-size of the domain specific
    data available, and (e) a lack of computing resources.
  section: Discussion and Conclusion
