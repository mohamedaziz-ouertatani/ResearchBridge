# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '2012.15802'
title: The Sample Complexity of Robust Covariance Testing
domain: Machine Learning
year: 2020
url: https://arxiv.org/abs/2012.15802v1
problem: The sample complexity of testing properties of high-dimensional distributions (specifically whether
  a Gaussian's covariance matrix equals the identity or is far from it) is well understood in the noiseless
  setting, but poorly understood when the data is corrupted by an adversary under Huber's contamination
  model, unlike robust learning/estimation, whose sample complexity is fairly well understood.
research_question: What is the sample complexity of robustly testing the covariance matrix of a high-dimensional
  Gaussian (distinguishing Sigma = I from Sigma far from I in Frobenius norm) when an epsilon fraction
  of the samples are adversarially corrupted, i.e., does robustness make covariance testing information-theoretically
  harder than covariance learning?
method: The authors prove an information-theoretic sample complexity lower bound using a hard-instance
  construction and chi-squared distance / total variation distance arguments. They construct an adversarial
  ensemble D of noisy Gaussian mixtures f[A] = (9/10)N(0, I+A) + (1/10)N(0, I-9A) for random symmetric
  matrices A (with entries drawn i.i.d. as N(0,1/d) subject to operator- and Frobenius-norm constraints),
  chosen so the mixture's average covariance is exactly the identity. They derive a closed-form formula
  for the chi-squared inner product between two such mixtures with respect to the standard Gaussian, show
  that this quantity concentrates near 1 for random A, B via a second-moment/concentration analysis of
  tr(AB) and tr((AB)^2), and use this to show that N = o(d^2) i.i.d. samples cannot distinguish the mixture
  ensemble from the standard multivariate Gaussian, establishing an Omega(d^2) sample lower bound for
  the robust testing task.
dataset: ''
main_contribution: The paper proves the first sample complexity lower bound of Omega(d^2) for robust covariance
  testing under Huber's contamination model (for epsilon an arbitrarily small constant and gap gamma =
  1/2), matching the O(d^2) upper bound achievable by robust covariance estimation. This resolves an open
  question posed by Balasubramanian and Yuan in the rejoinder to Cai, Ren, and Zhou (2016), and establishes
  that -- unlike the non-robust setting or the analogous robust learning problem -- adding a robustness
  requirement makes covariance testing strictly information-theoretically harder (as hard as robust estimation),
  a phenomenon they note does not occur for covariance learning.
results: Theorem 1 establishes that for any sufficiently small constant epsilon > 0, distinguishing the
  standard Gaussian N(0,I) on R^d from a contaminated distribution X = (1-epsilon)N(0,Sigma) + epsilon*B
  with ||Sigma - I||_F > 1/2 requires Omega(d^2) samples. This is contrasted with the noiseless setting,
  where Theta(d/gamma^2) samples suffice (Cai-Ma 2013; Cai-Ren-Zhou 2016), and with covariance learning,
  whose sample complexity (Theta(d^2/gamma^2)) is unaffected by the robustness requirement -- so testing
  and robust testing have a quadratic sample-complexity gap that does not exist between learning and robust
  learning.
limitations: ''
applications: ''
research_gap:
  addressed: Balasubramanian and Yuan's rejoinder to Cai-Ren-Zhou (2016) gave a counterexample showing
    the existing covariance tester fails under contamination and explicitly asked for the sample complexity
    of robust covariance testing under Huber's model; this paper answers that open question by proving
    a matching Omega(d^2) lower bound.
  remaining: ''
key_evidence:
- text: In sharp contrast to the sample complexity of robust learning (which is fairly well-understood
    for several natural settings), the sample complexity of robust testing in high dimensions is poorly
    understood.
  section: Introduction
- text: Our main result (Theorem 1) is that for \(\epsilon\) an arbitrarily small positive constant and
    \(\gamma=1/2\), robust covariance testing requires \(\Omega(d^{2})\) samples.
  section: Introduction
- text: In summary, our result shows that there is a quadratic gap between the sample complexity of testing
    and robust testing for the covariance.
