# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '2201.00052'
title: Evaluating Deep Music Generation Methods Using Data Augmentation
domain: Machine Learning
year: 2021
url: https://arxiv.org/abs/2201.00052v1
problem: Evaluation of deep algorithmic music generation typically relies on subjective, costly human
  evaluation, or on engineered musicality/reconstruction-loss measures that fail to capture abstract qualities
  such as theme, mood, or emotion.
research_question: Can a homogeneous, objective, data-augmentation-based framework reveal whether music
  samples generated by different deep generative models (SampleRNN, Jukebox, DDSP) contain meaningful
  information about mood/theme or emotion, as measured by the change in a classifier's predictive performance
  when its training data is augmented with generated samples?
method: The authors generate class-conditional music samples from three generative models representing
  different paradigms -- the autoregressive SampleRNN, the VQ-VAE-based Jukebox, and the Differentiable
  Digital Signal Processing (DDSP) autoencoder -- using priming (for SampleRNN and Jukebox) or reconstruction
  (for DDSP) to assign each generated sample the label of its seed/input. They then augment the training
  partition of a music mood/theme (and separately an emotion arousal/valence) classification dataset with
  a fixed proportion (5% of training duration) of generated samples per class, retrain a MobileNetV2 +
  self-attention classifier (from a MediaEval 2019 submission) on the augmented data, and compare its
  F1, PR-AUC, and ROC-AUC (macro/micro) against a baseline trained only on real data. They also directly
  classify the generated samples with a classifier trained on real data to check label validity via confusion
  matrices.
dataset: MTG-Jamendo dataset, using its 56-class mood/theme label subset from the MediaEval 2019 music
  classification competition, plus an additional emotion (arousal/valence, 4-class circumplex-model) relabelling
  derived from the mood/theme labels
main_contribution: This is presented as the first attempt at augmenting a music genre/mood classification
  dataset with conditionally generated music, and the first time these three music generation methods
  (SampleRNN, Jukebox, DDSP) have been considered for data augmentation of musical classification, providing
  a homogeneous objective evaluation framework across generation paradigms.
results: DDSP-generated samples yielded a consistent increase in mood/theme classification performance
  (both micro and macro averaged metrics), corresponding to an absolute improvement of 0.8% in macro-averaged
  PR-AUC/ROC-AUC over the MediaEval 2019 baseline submission, promoting it from 4th to 3rd place; SampleRNN
  and Jukebox samples did not consistently improve performance to the same degree, though they matched
  or exceeded baseline PR-AUC/ROC-AUC. For emotion labels, only Jukebox yielded a consistent (micro-averaged)
  performance increase, and only the 'activated pleasant' class consistently improved across all methods.
  Classifying the generated samples directly showed all methods biased toward specific classes (e.g. 'dark'
  mood/theme, 'activated unpleasant' emotion), with DDSP generalizing best across a wider range of classes.
limitations: This analysis depends on the behaviour of the classifier, so future work should explore the
  effect of different classifier architectures. The authors also note they assumed generated samples strictly
  inherit the label from an original or priming sample, which they show is not necessarily the case (only
  DDSP was consistent in class-conditional generation for the emotion task), and note the generated samples
  will inevitably be from a different distribution than the training data.
applications: Data augmentation for music mood/theme and emotion classification tasks; the authors suggest
  domain adversarial training and virtual adversarial training as directions to better exploit generated
  samples for augmentation.
research_gap:
  addressed: While each generative model was evaluated with some subjective human evaluation (often by
    the authors), there had been little effort to quantitatively and objectively evaluate generated music
    samples' meaningful content; this paper addresses that via a data-augmentation-based functional evaluation
    framework.
  remaining: Future work should explore the effect of different classifier architectures on this analysis,
    use domain adversarial training to uncover domain-invariant features in generated samples (since they
    come from a different distribution than training data), and develop more elaborate confidence estimation
    on augmentation labels (e.g. via virtual adversarial training), since generated samples do not always
    strictly inherit the label of the priming/original sample.
