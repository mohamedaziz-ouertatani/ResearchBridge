# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '2212.14524'
title: A novel cluster internal evaluation index based on hyper-balls
domain: Machine Learning
year: 2022
url: https://arxiv.org/abs/2212.14524v1
problem: Evaluating clustering quality and determining the optimal number of clusters is difficult, especially
  for data sets containing noise or clusters of arbitrary shape, where existing internal validity indices
  tend to perform poorly.
research_question: Can a cluster internal evaluation index built on multi-granularity hyper-ball representations
  of the data more accurately assess clustering quality and determine the optimal cluster number than
  existing indices, particularly for noisy data and arbitrarily shaped clusters?
method: The data set is characterized at multiple granularities using hyper-balls (HBs), refined from
  coarse to fine granularity via iterative 2-means splitting until a balance degree (the difference between
  the maximum and average distance of points to the HB center) falls below a threshold. Noisy hyper-balls
  (containing fewer than 4 samples) are removed. The proposed Hyper-ball-based Cluster Validity Index
  (HCVI) is then computed per cluster as the ratio of intracluster compactness (max distance between hyper-balls
  in a cluster) to intercluster separation (min distance between a cluster's hyper-balls and hyper-balls
  of other clusters), averaged and normalized across the possible number of clusters l (2 <= l <= sqrt(m)).
dataset: Synthetic data sets and real data sets (not individually named in the excerpted text).
main_contribution: A new cluster internal validity index (HCVI) based on hyper-ball granular representations,
  along with an improved hyper-ball splitting method (using the balance degree BD) and a noise-removal
  step, that together allow evaluation of clustering quality and determination of the optimal cluster
  number for noisy data with arbitrarily shaped clusters.
results: The experimental results on synthetic and real data sets indicate that the new HCVI index outperforms
  existing cluster validity indices, and it can evaluate clustering results produced by several classic
  clustering methods and determine the optimal cluster number for data sets containing noise and arbitrarily
  shaped clusters.
limitations: ''
