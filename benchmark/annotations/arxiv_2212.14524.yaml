research_gap:
  addressed: Existing hyper-ball splitting methods (e.g., GCHB's Distribution Measure-based split) tend
    to generate too many hyper-balls, so the paper addresses this by proposing a more effective splitting
    method based on balance degree to determine the optimal cluster number for noisy, arbitrarily shaped
    data.
