# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '2112.15344'
title: 'P2P-Loc: Point to Point Tiny Person Localization'
domain: Computer Vision
year: 2021
url: https://arxiv.org/abs/2112.15344v2
problem: Bounding-box annotation for visual object localization (e.g., tiny person/pedestrian localization
  in surveillance, driving-assistance, and drone imagery) is expensive and laborious, and is often unnecessarily
  precise or even infeasible for small, low-resolution, or low-signal-to-noise objects where exact object
  size does not matter.
research_question: Can person localization be performed effectively using only coarsely annotated points
  (any point within the object extent, 'CoarsePoint') instead of precise bounding boxes or precise points,
  despite the label uncertainty this coarse supervision introduces?
method: The authors propose CoarsePoint, a point-based localization task, together with a 'point self-refinement'
  algorithm that iteratively improves coarse point labels in a self-paced way. An estimator (e.g., RepPoints,
  built on a ResNet-50 backbone) is trained under the current (initially coarse) point supervision, then
  used to predict 'semantic statistic points' (SSPs) on training images; predicted points are assigned
  to objects via nearest-point clustering, and the top-K highest-scoring points per object within a distance
  threshold are merged (score-weighted averaging) into a refined point annotation, which becomes the supervision
  for the next iteration. The refined pseudo-box annotations are then fed to a separate locator network
  (e.g., RepPoints, Sparse RCNN, or Faster RCNN) for final prediction.
dataset: 'TinyPerson (72,651 annotated low-resolution human objects in 1,610 images, mostly smaller than
  32x32 pixels) and Visdrone-Person, a human-detection subset built from the VisDrone image-object-detection
  track (10,209 images: 6,471 train / 548 val / 3,190 test).'
main_contribution: The paper introduces CoarsePoint as a new vision task and sets the first solid baseline
  for object localization under coarse point supervision, and proposes the point self-refinement approach
  that iteratively promotes coarse point labels toward more semantically stable/discriminative locations
  (e.g., the head), narrowing the performance gap with precise bounding-box supervision.
results: CoarsePoint with self-refinement achieves comparable object localization performance to precise
  bounding-box-based methods while saving up to 80% of annotation cost/time. On VisDrone-Person, self-refinement
  improved AP_all(1.0) and AP_normal(1.0) by 8.82 and 42.9 points respectively under RepPoints+RepPoints,
  and by 13.2/24.2 points under RepPoints+Sparse-RCNN; on TinyPerson with Faster-RCNN as both estimator
  and locator, AP_all(1.0) improved by 20.27 points and AP_small(1.0) by 32.28 points. More refinement
  iterations and larger initial pseudo-box sizes both improved performance, with diminishing returns as
  iterations increased (e.g., on TinyPerson with an 8x8 initial box, AP_all(1.0) rose from 21.4 with no
  refinement to 62.8 after 3 iterations). The self-refinement process also reduces the number of false
  positives and, as measured by heatmaps of labeled-point position within the object box, reduces the
  variance of the point distribution, concentrating labels on stronger semantic regions such as the head.
limitations: ''
applications: The paper frames tiny person/pedestrian localization for visual surveillance, driving assistance,
  and mobile robotics as the target applications, and specifically targets scenarios where objects are
  far away or low-resolution (e.g., drone imagery) such that precise bounding-box or keypoint annotation
  is time-consuming or infeasible.
research_gap:
  addressed: Prior localization work required either fully supervised bounding-box annotation (expensive
    and unnecessary when object size doesn't matter) or precise point annotation (e.g., object-as-point
    or click-supervision methods), and weakly supervised object detection lacked instance-level constraints;
    no prior work established a baseline for localization under intentionally coarse (any-point-within-object)
    point supervision.
  remaining: ''
key_evidence:
- text: Experimental results show that our approach has achieved comparable object localization performance
    while saving up to 80% of annotation cost.
  section: Abstract
- text: We propose a CoarsePoint vision task, and under the relaxed point supervision, we set the first
    solid baseline for object localization;
  section: Introduction
- text: The annotation of the coarse point is quite efficient, and it just needs to click on the object.
    Under such annotation, our proposed self-refinement algorithm can still achieve excellent localization
    performance while saving much annotation time up to 80%.
  section: Results
- text: 'self-refinement improves \(AP_{1.0}^{all}\) and \(AP_{1.0}^{normal}\) by 8.82 and 42.9 points
    respectively under RP+RP conditions.'
  section: Results
- text: Fig. 7 shows that the self-refinement significantly reduces the number of false positives, leading
    to the improvement of the network's discriminative ability.
  section: Results
