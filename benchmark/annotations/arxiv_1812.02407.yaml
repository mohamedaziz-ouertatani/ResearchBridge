# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '1812.02407'
title: 'Elastic Gossip: Distributing Neural Network Training Using Gossip-like Protocols'
domain: Machine Learning
year: 2018
url: https://arxiv.org/abs/1812.02407v1
problem: Most contemporary approaches to distributing neural network training focus on scaling using large
  computing clusters and require high network bandwidth and frequent communication, making them poorly
  suited to settings like IoT devices, edge servers, or heterogeneous/decentralized environments where
  bandwidth and connectivity are constrained.
research_question: Can a decentralized, gossip-like communication protocol that extends Elastic Averaging
  SGD (EASGD) but removes its central coordinating process match the performance of existing decentralized
  approaches (Gossiping SGD) and centralized approaches (All-reduce SGD) for distributed neural network
  training, while reducing communication overhead?
method: The thesis proposes Elastic Gossip, which reformulates the EASGD global consensus objective (which
  penalizes worker parameters for deviating from a central 'consensus' variable) to eliminate the central
  variable, instead estimating consensus via pairwise (peer-to-peer) gossip-style communication between
  randomly selected worker pairs, while preserving EASGD's 'elastic symmetry' property in the resulting
  update rule. It is evaluated against Gossiping SGD and Synchronous All-reduce SGD using MLPs on permutation-invariant
  MNIST and a pre-activation ResNet-18 on CIFAR-10, varying cluster size, communication probability, and
  the moving-rate hyperparameter alpha.
dataset: MNIST (permutation-invariant digit classification, 60,000 train / 10,000 test) and CIFAR-10 (image
  classification, 50,000 train / 10,000 test)
main_contribution: Elastic Gossip is introduced as the first gossip-like extension of EASGD that maintains
  elastic symmetry in updates while removing the need for a central coordinating process, unifying EASGD,
  Gossiping SGD, and GoSGD as special cases of a single generalized update rule.
results: On MNIST with 4 and 8 worker clusters across several communication probabilities, Elastic Gossip
  consistently outperformed Gossiping SGD (e.g. EG-4-0.031 reached 0.9862 rank-0 accuracy vs GS-4-0.125's
  0.9855 despite 4x lower communication probability), and Elastic Gossip, Gossiping SGD, and All-reduce
  SGD performed comparably overall even though All-reduce has substantially higher communication cost.
  On CIFAR-10 with a ResNet-18, Elastic Gossip again generally outperformed Gossiping SGD across communication
  probabilities (e.g. 0.9166 vs 0.9131 rank-0 accuracy at p=0.125), though All-reduce SGD achieved the
  best accuracy (0.9193).
limitations: While results presented in this thesis seem very encouraging, applying Elastic Gossip (as
  with any other technique) would require a rigorous hyper-parameter search, and its performance in comparison
  to similar techniques would likely depend on the application. Experiments used small cluster sizes and
  assumed homogeneous hardware/environment and fully connected network topologies with constant communication
  cost between peers, and only the supervised learning paradigm was studied.
applications: The thesis motivates Elastic Gossip for scenarios such as training at data sources like
  IoT devices and edge servers, utilizing underutilized resources across heterogeneous environments, and
  decentralized/federated settings where training data cannot be transferred due to privacy concerns (e.g.
  patients' health data).
research_gap:
  addressed: While there is interest in understanding training behavior in inherently distributed systems
    such as wireless sensor networks and IOT devices, there appears to be very little information about
    this in the public domain; the thesis addresses this by proposing and evaluating a decentralized,
    parameter-server-free gossip protocol.
  remaining: The behavior of the techniques remains to be studied in environments with simulated (controlled)
    asynchrony, at larger cluster scales, under non-homogeneous hardware/network conditions, under biased/skewed
    data partitioning, and in unsupervised or reinforcement learning paradigms rather than only supervised
    learning.
