  section: Results
- text: Our study of the main semantics in the literature has shown that only the original semantics (G91;
    Gelfond 1991), its generalisations to propositional formulas (Wang and Zhang 2005; Truszczy´nski 2011)
    and Founded Autoepistemic Equilibrium Logic (C19; Cabalar et al. 2019a), satisfy epistemic splitting
    while the rest of approaches we considered do not, as we showed with counterexamples.
