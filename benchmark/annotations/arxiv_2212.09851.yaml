# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '2212.09851'
title: 'PathCAS: An Efficient Middle Ground for Concurrent Search Data Structures'
domain: Systems
year: 2022
url: https://arxiv.org/abs/2212.09851v1
problem: Building concurrent search data structures traditionally forces a choice between highly complex,
  hard-to-verify fine-grained lock-free/lock-based algorithms that achieve top performance, and simpler
  general techniques like transactional memory (TM) that are easier to use but suffer from overhead, limited
  hardware availability, or security-related disabling on real platforms.
research_question: Can a synchronization primitive occupy a useful middle ground between fine-grained
  handcrafted designs and transactional memory, sacrificing some generality for simplicity while remaining
  competitive with state-of-the-art handcrafted concurrent search trees?
method: The paper introduces PathCAS, a primitive combining ideas from multi-word compare-and-swap (KCAS,
  building on the lock-free Harris-Fraser-Pratt KCAS algorithm) with transactional-memory-like semantics
  (start/read/add/visit/validate/exec/vexec). It uses per-node version numbers to validate that visited
  nodes are unchanged, restricting itself relative to full TM by not guaranteeing opacity and using a
  bounded read-set. PathCAS is used to build a lock-free internal binary search tree and extended to a
  lock-free relaxed internal AVL tree (using Bougé's rebalancing scheme), with both a hardware-transactional-memory
  (HTM) fast-path implementation and a software-only fallback.
dataset: 'No external datasets; evaluation uses synthetic microbenchmarks (uniform random keys) via the
  Setbench benchmark framework, with tree sizes of 2x10^5, 2x10^6, and 2x10^7 keys and update rates of
  1%, 10%, and 100%, on Intel and AMD multicore systems (AMD system: two EPYC 7662 CPUs, 256 hardware
  threads).'
main_contribution: The paper's specific new contribution is the PathCAS primitive itself (combining KCAS
  with version-based path validation and a strong-vexec mechanism to avoid spurious failures), and its
  use to build the first PathCAS-based lock-free internal BST and internal AVL tree implementations that
  are both relatively easy to prove correct and empirically competitive with the fastest known handcrafted
  concurrent search trees.
results: 'PathCAS-based trees are highly competitive across read-heavy to update-heavy workloads: the
  unbalanced BST implementation (int-bst-pathcas) outperforms the state of the art in unbalanced BSTs
  (it has the smallest cycle count per operation and the fewest last-level cache misses of the unbalanced
  trees compared), and the balanced AVL implementation (int-avl-pathcas) is competitive with the fastest
  known balanced BST (pext-avl-occ) in read-mostly workloads and is at most 20% slower than the fastest
  algorithm in the 100% update workload. On the Intel system with hardware transactional memory support,
  the PathCAS trees outperform the next fastest algorithm, TLE, by nearly 2x. The paper also implements
  and evaluates an internal BST built on MCMS (a prior KCAS-based middle-ground primitive) for comparison,
  but the specific numeric results of that comparison are not present in the fulltext excerpt available
  (the "Comparison with MCMS" section is cut off before reporting results); the paper states more broadly
  that known middle-ground techniques such as MCMS "often fail to scale in the context of high-performance
  data structures."'
limitations: 'PathCAS is explicitly less expressive than full transactional memory: it does not guarantee
  opacity and has a bounded read-set (exceeding the read-set size triggers an assertion in the implementation).
  The paper also states that avoiding vexec failures altogether is impossible, and only mitigates (rather
  than eliminates) spurious failures via the "strong vexec" fallback path. Several technical details --
  a detailed discussion of correctness bugs found in prior lock-based/lock-free BST implementations, full
  correctness proofs and details of the AVL tree extension, treatment of version-number wrapping, further
  experimental results (including on Intel systems and additional algorithms/workloads), and details of
  bugs found in the original MCMS implementation -- are explicitly deferred to "the full version of this
  paper" rather than included here.'
applications: Concurrent search data structures such as binary search trees and AVL trees for use in multithreaded/shared-memory
  systems.
research_gap:
  addressed: Prior middle-ground techniques between fine-grained handcrafted designs and transactional
    memory (such as MCMS) often fail to scale for high-performance search data structures because their
    software fallback path writes to the entire search path, causing contention and cascading hardware-transaction
    aborts; PathCAS avoids this overhead while still simplifying correctness arguments relative to fine-grained
    designs.
  remaining: 'The paper repeatedly defers material to "the full version of this paper" rather than stating
    open problems as future work: this includes a detailed discussion of correctness bugs identified in
    prior BST implementations, complete correctness proofs and details of the AVL rebalancing extension,
    treatment of version-number wrapping, additional experiments (including Intel results and further
    algorithms/workloads), and details of bugs found in the original MCMS implementation.'
key_evidence:
- text: In this paper, we explore this middle ground, and present PathCAS, a primitive that combines ideas
    from multi-word CAS (KCAS) and transactional memory approaches, while carefully avoiding overhead.
  section: Abstract
- text: We find that PathCAS data structures are highly competitive, across the range from read-heavy
    to update-heavy workloads. In particular, our unbalanced BST implementation manages to outperform
    the state-of-the-art in unbalanced BSTs, and our balanced implementation matches the performance of
    the fastest known balanced BST in read-mostly workloads.
  section: Introduction
- text: It is impossible to avoid _vexec_ failures altogether.
  section: Avoiding spurious failures
- text: PathCAS does not guarantee opacity, and (2) PathCAS has a bounded read-set.
  section: Introduction
