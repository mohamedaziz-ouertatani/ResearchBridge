# Benchmark annotation - ResearchBridge.md Sec 25.

source: arxiv
source_id: '2001.00098'
title: Avoiding Spurious Local Minima in Deep Quadratic Networks
domain: Machine Learning
year: 2019
url: https://arxiv.org/abs/2001.00098v2
problem: Despite the practical success of training neural networks with non-convex first-order methods
  like gradient descent, a rigorous theoretical understanding of why these methods reliably find global
  minima is lacking, because the loss landscape of neural networks is high-dimensional, non-convex, and
  highly nonlinear, and training such networks (with non-linear activations) is known to be NP-hard in
  general.
research_question: Under what conditions does the mean-squared-error loss landscape of (single-layer and
  deep) neural networks with quadratic activation functions avoid spurious local minima and bad saddle
  points, so that gradient descent is guaranteed to converge to a global minimum, without the restrictive
  assumptions on the number of neurons or the sign structure of the output weights required by prior work?
method: 'The authors analyze quadratic-linear (QL) networks -- networks with a quadratic activation layer
  followed by a trainable linear layer -- and study the empirical risk landscape L(lambda, Q). They first
  prove by construction (Example 2.1) that this unmodified landscape has spurious local minima. They then
  propose a modified objective L(alpha, lambda, Q) with two possible changes that do not alter the global
  minimum''s objective value: (1) adding the norm of the training data as an extra fixed regressor (parameter
  alpha), i.e. a data-normalization trick, and (2) adding an orthogonality penalty on the weight matrix
  Q, gamma||QQ^T - I||^2_Fro, that regularizes the symmetric factorization toward the eigenvalue decomposition.
  They state these modifications allow proving no spurious local minima for k >= d hidden neurons, extend
  the argument to deep overparameterized QL networks, and note the results are independent of data distribution.'
dataset: Not stated in the portion of the paper covered by this fulltext extraction. The available .nougat.md
  file for this paper is truncated partway through Section 3.1 (Modified Landscape) and does not include
  an Experiments/Results section; the abstract only states that the theoretical results are "empirically
  demonstrate[d]" for "these problems" without naming a dataset in the extracted text.
main_contribution: A theoretical characterization of the loss landscape of quadratic neural networks that
  removes restrictive assumptions of prior work by proving no spurious local minima for k >= d hidden
  units (rather than the k >= 2d required previously) via two distribution-independent landscape modifications
  (a data-norm regressor and an orthogonality penalty), and extending these landscape guarantees to deep,
  overparameterized quadratic networks.
results: Within the portion of the paper covered by this extraction (through Section 3.1), the paper's
  results are stated as theoretical guarantees rather than reported experimental numbers. It proves that
  the unmodified two-layer QL landscape contains spurious local minima (Example 2.1), and states that with
  either the Added Norm or the orthogonality-penalty modification, spurious local minima and bad saddle
  points can be escaped with probability one under random initialization once k >= d, closing the gap
  with prior work that required k >= 2d. The abstract additionally claims deep overparameterized QL networks
  benefit from similar landscape properties and that convergence to a global minimum is empirically demonstrated,
  but the extracted fulltext is truncated before the experiments/results section, so no numerical results
  could be verified from this file.
limitations: The paper itself notes that all two-layer neural networks with polynomial activation functions,
  including QNNs, do not enjoy the same universal approximation theorems as two-layer networks with sigmoid
  or ReLU activations, meaning increasing the number of neurons in a two-layer QNN beyond k=d does not
  add any expressive power.
applications: The primary application noted is providing conditions under which stochastic gradient descent
  is guaranteed to converge to a global minimizer for quadratic networks; the paper also notes relevance
  to theoretical neuroscience, since a quadratic response to a low-dimensional projection is the standard
  model used for complex cells in the visual cortex.
research_gap:
  addressed: Prior work (Soltanolkotabi et al., cited as [5]) proved no-spurious-local-minima results only
    for k >= 2d hidden units (or under a fixed sign structure matching a planted ground truth), and other
    prior work ([27], [28]) either restricted to positive semidefinite matrices or only ruled out spurious
    local valleys rather than local minima, with none considering deep networks or multivariate outputs;
    this paper closes the gap down to k = d and extends the guarantees to deep, overparameterized quadratic
    networks.
  remaining: The paper states that the existence of spurious local valleys for d <= k <= 2d "is still an
    open question."
key_evidence:
- text: Despite their practical success, a theoretical understanding of the loss landscape of neural networks
    has proven challenging due to the high-dimensional, non-convex, and highly nonlinear structure of such
    models.
