# Sec 27 retrieval evaluation: topical queries independent of any single
# benchmark paper, unlike relevance.py's self-retrieval queries (which are
# derived from reading one target paper, and were found to saturate at a
# perfect 1.0 for every baseline as a result - see relevance.py's docstring
# and the commit that added this file).
#
# Each query was written first, with no specific paper in mind. Candidates
# were pooled from TF-IDF + BM25 + embedding search (top 12 each, standard
# IR pooling so judgment isn't biased toward whichever method was checked
# first), then judged relevant or not by reading title/abstract. Multiple
# relevant documents per query, unlike the self-retrieval set's exactly one -
# this is what actually lets Recall@K and nDCG@K mean something here.

